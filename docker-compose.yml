version: '3.8'

services:
  expo-mobile-app:
    build: .
    image: cc-mobile-expo:latest
    ports:
      - "8081:8081"
    container_name: cc-mobile-expo-container
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
    volumes:
      - .:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
